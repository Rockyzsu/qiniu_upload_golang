<html lang="CN">
<head>
    <meta charset="ansi"/>
    <title>所有图片</title>
    <script src="//libs.baidu.com/jquery/2.1.1/jquery.min.js"></script>
    <script type="text/javascript">
        var currentPage = 1;
        var maxPages = 1;

        function loadImages() {
            var pwd = $("#pwd").val();
            $.ajax({
                url: "/w",
                method: 'POST',
                data: {password: pwd, page: currentPage},
                success: function (result) {
                    if (result.status === 0 || !result.TotalImage) {
                        alert("密码错误");
                        return;
                    }
                    displayImages(result.TotalImage);
                    maxPages = Math.ceil(result.length / 20);
                    $(".show").text(currentPage);
                    $("#gallery_content").show();
                    $("#password_section").hide();
                },
                fail: function () {
                    alert("请求失败");
                }
            });
        }

        function displayImages(imageList) {
            $("#id_body").empty();
            for (var i = 0; i < imageList.length; i++) {
                img = imageList[i];
                var image_div = `<div class="div_photo">
                   <img height=250 width=250 src="${img}"/>
                   <div class="div_phototime"><a href="${img}">${img}</a></div>
                   <button class="removeBT" id="${img}" onclick="removeImage(this)">删除</button>
                </div>`;
                $("#id_body").append(image_div);
            }
        }

        function NextPage(page) {
            var pwd = $("#pwd").val();
            $.ajax({
                url: "/w",
                method: 'POST',
                data: {password: pwd, page: page},
                success: function (result) {
                    if (result.TotalImage) {
                        displayImages(result.TotalImage);
                        currentPage = page;
                        $(".show").text(currentPage);
                    }
                }
            });
        }

        $(document).ready(function () {
            $("#gallery_content").hide();
            $("#back").click(function () {
                if (currentPage <= 1) {
                    currentPage = maxPages;
                } else {
                    currentPage--;
                }
                NextPage(currentPage);
            });

            $("#next").click(function () {
                if (currentPage >= maxPages) {
                    currentPage = 1;
                } else {
                    currentPage++;
                }
                NextPage(currentPage);
            });
        });

        function removeImage(element) {
            $.ajax({
                url: "/image/remove",
                method: 'POST',
                data: {identifier: element.id},
                success: function () {
                    location.reload();
                }
            });
        }
    </script>

    <style>
        .div_top {
            width: 100%;
            height: 56px;
            background-color: #777;
        }
        .div_title {
            width: 100%;
            height: 100px;
            background-color: #555;
            margin-top: 10px;
        }
        .div_body {
            width: 100%;
            height: 1000px;
            background-color: #bbb;
            margin-top: 10px;
        }
        .div_menu {
            width: 5%;
            height: 56px;
            float: left;
            font-size: 14px;
            color: #fff;
            text-align: center;
            line-height: 56px;
        }
        .color-menu1 { background-color: #999; }
        .color-menu2 { background-color: #666; }
        .div_titledata {
            height: 24px;
            width: 166px;
            float: left;
            font-size: 22px;
            margin-left: 2%;
            color: #f0ffff;
        }
        .div_titledata2 {
            height: 24px;
            width: 600px;
            float: left;
            font-size: 22px;
            margin-left: 2%;
            color: #f0ffff;
        }
        .div_photo {
            height: 300px;
            width: 20%;
            float: left;
            margin-left: 30px;
            margin-top: 10px;
        }
        .div_phototime {
            height: 25px;
            width: 250px;
            text-align: left;
            line-height: 25px;
            background-color: #A9A9A9;
        }
        .div_end {
            text-align: center;
            width: 100%;
            height: 10%;
            float: left;
            background-color: #555;
        }
        .anniu {
            width: 100px;
            height: 50px;
            background: red;
        }
        .show {
            width: 100px;
            height: 50px;
            background: rgb(143, 231, 163);
            text-align: center;
            line-height: 50px;
        }
        .anniu, .show {
            float: left;
        }
    </style>
</head>

<body style="background-color:#969696">

<div align="center" style="padding-top:200px;" id="password_section">
    <p>输入密码：<input type="password" id="pwd"> <button onclick="loadImages()">查询</button></p>
</div>

<div id="gallery_content">
    <div class="div_top">
        <div class="div_menu color-menu1" style="margin-left:5%">相册</div>
        <div class="div_menu color-menu2">照片</div>
        <div class="div_menu color-menu2" style="float:right">反馈</div>
    </div>

    <div class="div_title">
        <div class="div_titledata"><b>说说和日志相册</b></div>
        <div class="div_titledata2"><b>上传照片/视频 批量管理</b></div>
    </div>

    <div id="id_body" class="div_body"></div>

    <div class="div_end">
        <div>
            <div class="anniu" id="back"><img src="static/left.jpeg" width=100px height=50px></div>
            <div class="show">1</div>
            <div class="anniu" id="next"><img src="static/right.jpeg" width=100px height=50px></div>
        </div>
    </div>
</div>

</body>
</html>
